<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff2f86"><title>Pop Roll</title><link rel="stylesheet" href="style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body><header class="hero"><img src="logo.jpeg" class="logo"><div class="hero-copy"><h1>Pop Roll</h1><p id="s1"></p><p id="s2"></p></div><div class="language-switch"><button id="ru" class="lang active">RU</button><button id="vi" class="lang">VI</button></div></header><main><section class="opening"><div class="badge">GRAND OPENING</div><h2 id="openTitle"></h2><p id="openText"></p><div id="delivery"></div></section><nav id="cats" class="cats"></nav><section id="products" class="products"></section></main><button id="cartBar" class="cart-bar" hidden><span>🛒 <span id="cartLabel"></span>: <b id="cartCount">0</b></span><strong id="cartTotal">0 ₫</strong></button><div id="modal" class="modal" hidden><div class="modal-card"><div class="modal-head"><h2 id="orderTitle"></h2><button id="close" class="icon-btn">✕</button></div><div id="cartItems"></div><label><span id="nameLabel"></span><input id="name"></label><label><span id="phoneLabel"></span><input id="phone" inputmode="tel"></label><label><span id="addressLabel"></span><textarea id="address"></textarea></label><label><span id="paymentLabel"></span><select id="payment"><option value="cash" id="cash"></option><option value="qr" id="qr"></option></select></label><label><span id="commentLabel"></span><textarea id="comment"></textarea></label><div class="checkout"><span id="totalLabel"></span><strong id="checkoutTotal">0 ₫</strong></div><button id="send" class="primary"></button><p id="hint" class="hint"></p></div></div><script src="app.js"></script></body></html>
