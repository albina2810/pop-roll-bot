<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff2f86" />
  <title>Pop Roll</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="hero">
    <img src="logo.jpeg" alt="Pop Roll" class="logo" />
    <div>
      <h1>Pop Roll</h1>
      <p>Красиво снаружи. Вкусно внутри.</p>
    </div>
  </header>

  <main>
    <section class="notice">
      <strong>Доставка по Нячангу</strong>
      <span>Свежие роллы, бенто-боксы, bubble tea и десерты</span>
    </section>

    <nav class="categories" id="categories"></nav>
    <section class="products" id="products"></section>
  </main>

  <button class="cart-bar" id="cartBar" hidden>
    <span>🛒 Корзина: <b id="cartCount">0</b></span>
    <strong id="cartTotal">0 ₫</strong>
  </button>

  <div class="modal" id="cartModal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2>Ваш заказ</h2>
        <button id="closeCart" class="icon-btn">✕</button>
      </div>
      <div id="cartItems"></div>

      <label>Имя
        <input id="customerName" placeholder="Как к вам обращаться?" />
      </label>
      <label>Телефон
        <input id="customerPhone" placeholder="+84..." inputmode="tel" />
      </label>
      <label>Адрес доставки
        <textarea id="customerAddress" placeholder="Например: Oceanus OC2A, квартира..."></textarea>
      </label>
      <label>Комментарий
        <textarea id="customerComment" placeholder="Без васаби, позвонить по приезде..."></textarea>
      </label>

      <div class="checkout-total">
        <span>Итого</span>
        <strong id="checkoutTotal">0 ₫</strong>
      </div>
      <button id="sendOrder" class="primary">Оформить заказ</button>
      <p class="hint">На первом этапе заказ откроется сообщением в Telegram.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
